  <line x1="24" y1="13" x2="13" y2="33" stroke="#F8E7C9" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="24" y1="13" x2="35" y2="33" stroke="#F8E7C9" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="13" y1="33" x2="35" y2="33" stroke="#F8E7C9" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
